# ~/.config/fuzzel/fuzzel.ini

[main]
font=monospace:size=12
icon-theme=hicolor
icons-enabled=no
terminal=alacritty
layer=overlay
lines=10
width=35
horizontal-pad=12
vertical-pad=8
inner-pad=6

[colors]
# Nord / Nordic palette
background=2e3440ff
text=eceff4ff
match=88c0d0ff
selection=4c566aff
selection-text=eceff4ff
selection-match=88c0d0ff
border=5e81acff

[border]
width=2
radius=6

[dmenu]
exit-immediately-if-empty=yes
