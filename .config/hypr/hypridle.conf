general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd =  dunstify bye       # lock before suspend.
    after_sleep_cmd = dunstify hello	# to avoid having to press a key twice to turn on the display.
}
listener {
    timeout = 180                                # 2.5min.
    on-timeout = hyprlock        # set monitor backlight to minimum, avoid 0 on oled monitor. 
    on-resume = echo "ow"
}
listener { 
	timeout = 600
	on-timeout = systemctl hybrid-sleep
	on-resume = dunstify wellcome back
}
